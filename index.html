<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tip Check — Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3ecdf;
      --ink: #1c1915;
      --muted: #6b6258;
      --card: #fffaf2;
      --line: rgba(28, 25, 21, 0.12);
      --accent: #c45c26;
      --accent-soft: #f3d9c8;
      --stub: #1c1915;
      --stub-text: #f6efe4;
      --stub-muted: #c9bba8;
      --input: #fffdf8;
      --shadow: 0 24px 60px rgba(40, 28, 16, 0.16);
      --toggle-track: #e7dccb;
      --toggle-knob: #fffaf2;
      --focus: #c45c26;
    }

    html[data-theme="dark"] {
      --paper: #12110f;
      --ink: #f4ece1;
      --muted: #b4a898;
      --card: #1c1a17;
      --line: rgba(244, 236, 225, 0.12);
      --accent: #e8a87c;
      --accent-soft: #3a2b22;
      --stub: #0c0b0a;
      --stub-text: #f6efe4;
      --stub-muted: #b7aa98;
      --input: #26231f;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      --toggle-track: #3a342d;
      --toggle-knob: #f4ece1;
      --focus: #e8a87c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Outfit, "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%),
        var(--paper);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px 16px;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .shell {
      width: min(920px, 100%);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 12px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand small {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.68rem;
      color: var(--muted);
    }

    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.7rem, 3vw, 2.35rem);
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.03em;
    }

    .theme-toggle {
      position: relative;
      width: 76px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: var(--toggle-track);
      cursor: pointer;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: inset 0 0 0 1px var(--line);
      transition: background-color 0.35s ease;
    }

    .theme-toggle:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .theme-toggle .icon {
      width: 16px;
      height: 16px;
      z-index: 1;
      opacity: 0.7;
    }

    .knob {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--toggle-knob);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] .knob {
      transform: translateX(36px);
    }

    .card {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      background: var(--card);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    .form {
      padding: clamp(22px, 4vw, 36px);
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.86rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .hint {
      color: var(--muted);
      font-weight: 400;
    }

    .input-wrap {
      position: relative;
    }

    .prefix {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-family: Fraunces, Georgia, serif;
      font-size: 1.15rem;
    }

    input[type="number"] {
      width: 100%;
      appearance: textfield;
      -moz-appearance: textfield;
      background: var(--input);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 14px 34px;
      font: 600 1.15rem Outfit, sans-serif;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.4s ease;
    }

    #tip {
      padding-left: 14px;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .preset {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 8px;
      font: 600 0.95rem Outfit, sans-serif;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
    }

    .preset:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .preset:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .preset.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fffaf2;
    }

    html[data-theme="dark"] .preset.active {
      color: #1c1915;
    }

    .stub {
      background: var(--stub);
      color: var(--stub-text);
      padding: clamp(22px, 4vw, 36px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .stub::before {
      content: "";
      position: absolute;
      inset: 18px auto 18px 0;
      width: 14px;
      background-image: radial-gradient(circle, var(--card) 6px, transparent 7px);
      background-size: 14px 22px;
      background-repeat: repeat-y;
    }

    .stub h2 {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.35rem;
      margin: 0 0 6px;
    }

    .stub p {
      margin: 0;
      color: var(--stub-muted);
      font-size: 0.92rem;
    }

    .totals {
      display: grid;
      gap: 18px;
      margin-top: 28px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px dashed rgba(246, 239, 228, 0.22);
    }

    .row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .row span {
      color: var(--stub-muted);
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .row strong {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .row.grand strong {
      color: var(--accent);
      font-size: 2.15rem;
    }

    .stamp {
      margin-top: 28px;
      align-self: flex-end;
      border: 2px solid var(--accent);
      color: var(--accent);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transform: rotate(-8deg);
      opacity: 0.9;
    }

    @media (max-width: 760px) {
      .card {
        grid-template-columns: 1fr;
      }

      .stub::before {
        inset: 0 0 auto;
        width: 100%;
        height: 14px;
        background-image: radial-gradient(circle, var(--card) 6px, transparent 7px);
        background-size: 22px 14px;
        background-repeat: repeat-x;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand">
        <small>Guest check</small>
        <h1>Tip Calculator</h1>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <span class="knob"></span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" />
        </svg>
      </button>
    </div>

    <section class="card">
      <form class="form" id="tipForm" aria-labelledby="form-title">
        <h2 id="form-title" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Bill details</h2>

        <div class="field">
          <label for="bill">Bill amount <span class="hint">USD</span></label>
          <div class="input-wrap">
            <span class="prefix" aria-hidden="true">$</span>
            <input id="bill" name="bill" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" autocomplete="off" />
          </div>
        </div>

        <div class="field">
          <label for="tip">Tip percentage</label>
          <input id="tip" name="tip" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="15" autocomplete="off" />
          <div class="presets" role="group" aria-label="Quick tip percentages">
            <button type="button" class="preset" data-tip="10">10%</button>
            <button type="button" class="preset active" data-tip="15" aria-pressed="true">15%</button>
            <button type="button" class="preset" data-tip="20">20%</button>
          </div>
        </div>
      </form>

      <aside class="stub" aria-live="polite">
        <div>
          <h2>Your check</h2>
          <p>Totals update as you type.</p>
          <div class="totals">
            <div class="row">
              <span>Tip</span>
              <strong id="tipAmount">$0.00</strong>
            </div>
            <div class="row grand">
              <span>Total</span>
              <strong id="totalAmount">$0.00</strong>
            </div>
          </div>
        </div>
        <div class="stamp" id="stamp">15% service</div>
      </aside>
    </section>
  </main>

  <script>
    const html = document.documentElement;
    const billInput = document.getElementById("bill");
    const tipInput = document.getElementById("tip");
    const tipAmountEl = document.getElementById("tipAmount");
    const totalAmountEl = document.getElementById("totalAmount");
    const stamp = document.getElementById("stamp");
    const themeToggle = document.getElementById("themeToggle");
    const presets = Array.from(document.querySelectorAll(".preset"));
    const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

    function preferredTheme() {
      const saved = localStorage.getItem("tip-theme");
      if (saved === "light" || saved === "dark") return saved;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function applyTheme(theme) {
      html.setAttribute("data-theme", theme);
      const dark = theme === "dark";
      themeToggle.setAttribute("aria-pressed", String(dark));
      themeToggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    }

    applyTheme(preferredTheme());

    themeToggle.addEventListener("click", () => {
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      localStorage.setItem("tip-theme", next);
      applyTheme(next);
    });

    function syncPresets(value) {
      presets.forEach((btn) => {
        const on = Number(btn.dataset.tip) === value;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-pressed", String(on));
      });
    }

    function calculate() {
      const bill = Math.max(0, parseFloat(billInput.value) || 0);
      const tipPercent = Math.max(0, parseFloat(tipInput.value) || 0);
      const tip = bill * (tipPercent / 100);
      const total = bill + tip;

      tipAmountEl.textContent = money.format(tip);
      totalAmountEl.textContent = money.format(total);
      stamp.textContent = `${tipPercent || 0}% service`;
      syncPresets(tipPercent);
    }

    billInput.addEventListener("input", calculate);
    tipInput.addEventListener("input", calculate);

    presets.forEach((btn) => {
      btn.addEventListener("click", () => {
        tipInput.value = btn.dataset.tip;
        calculate();
        tipInput.focus();
      });
    });

    calculate();
  </script>
</body>
</html>
